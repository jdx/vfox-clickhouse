name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5

      - name: Install clickhouse from local plugin
        run: |
          mise settings set experimental true
          mise use "vfox:file://${{ github.workspace }}@25.3.9.72-lts"
        env:
          MISE_DEBUG: 1

      - name: Verify clickhouse works
        run: |
          mise x "vfox:file://${{ github.workspace }}@25.3.9.72-lts" -- clickhouse --version
